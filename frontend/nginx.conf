server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hashed Vite assets never change content, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths must still return index.html,
    # otherwise a refresh on any route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container Apps probes this; it must not be rewritten to index.html.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
